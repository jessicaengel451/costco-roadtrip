name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write    # for AWS OIDC
  pull-requests: write    # for terraform plan PR comment

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  lambdas:
    name: lambdas (build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/lambdas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/lambdas/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles
          path: |
            infra/lambdas/get-visits/bundle.zip
            infra/lambdas/put-visits/bundle.zip

  playwright:
    name: playwright (mocked E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          PW_MAX_FAILURES: '15'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/

  terraform-plan:
    name: terraform (fmt, validate, plan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lambdas]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles
          path: infra/lambdas

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - run: terraform fmt -recursive -check
      - run: terraform init
      - run: terraform validate
      - name: terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -var-file=envs/dev.tfvars -no-color -out=tfplan 2>&1 | tee plan.txt
        env:
          TF_VAR_google_client_id: ${{ secrets.TF_VAR_GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET }}
          TF_VAR_github_repo: ${{ secrets.TF_VAR_GITHUB_REPO }}
          TF_VAR_github_oauth_token: ${{ secrets.TF_VAR_GITHUB_OAUTH_TOKEN }}

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('infra/plan.txt', 'utf8').slice(0, 60_000)
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### terraform plan (dev)\n\n\`\`\`\n${plan}\n\`\`\``,
            })

  deploy-dev:
    name: deploy (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [web, lambdas, playwright, terraform-plan]
    environment: dev
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles
          path: infra/lambdas

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - run: terraform init
      - run: terraform apply -auto-approve -var-file=envs/dev.tfvars
        env:
          TF_VAR_google_client_id: ${{ secrets.TF_VAR_GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET }}
          TF_VAR_github_repo: ${{ secrets.TF_VAR_GITHUB_REPO }}
          TF_VAR_github_oauth_token: ${{ secrets.TF_VAR_GITHUB_OAUTH_TOKEN }}
